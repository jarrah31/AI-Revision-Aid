<script>
Alpine.data('uploadHistoryPage', () => ({
    batches: [],
    loading: true,
    totalCost: 0,
    expanded: {},      // batch_id -> bool
    breakdowns: {},    // batch_id -> {breakdown:[...], total_cost_usd, ...}
    bdLoading: {},     // batch_id -> bool
    // Regenerate-blend modal: phase ∈ 'confirm' | 'running' | 'done' | 'error'
    reblendModal: { open: false, batch: null, phase: 'confirm', result: null, error: null, hadBlend: false },
    _reblendAbort: null,

    async init() {
        try {
            this.batches = await API.get('/costs/history');
            this.totalCost = this.batches.reduce((s, b) => s + (b.cost_usd || 0), 0);
        } catch (e) {
            $store.app.showToast('Failed to load upload history', 'error');
        } finally {
            this.loading = false;
        }
    },

    canReblend(b) {
        return b.batch_type === 'knowledge_organiser' && b.status === 'completed';
    },

    openReblend(b) {
        this.reblendModal = {
            open: true, batch: b, phase: 'confirm', result: null, error: null,
            hadBlend: (b.past_paper_count || 0) > 0,
        };
    },

    async confirmReblend() {
        const b = this.reblendModal.batch;
        this.reblendModal.phase = 'running';
        this.reblendModal.error = null;
        this._reblendAbort = new AbortController();
        try {
            const r = await API.post('/upload/' + b.id + '/reblend', {}, this._reblendAbort.signal);
            this.reblendModal.result = r;
            this.reblendModal.phase = 'done';
        } catch (e) {
            if (e.name === 'AbortError') {
                // Cancelled client-side. The server call may still complete, so a
                // refresh ensures we show whatever final state it reached.
                this.reblendModal.open = false;
                $store.app.showToast('Regeneration cancelled — refreshing in case it finished.', 'info');
                setTimeout(() => location.reload(), 800);
                return;
            }
            this.reblendModal.error = e.message || 'Unknown error';
            this.reblendModal.phase = 'error';
        } finally {
            this._reblendAbort = null;
        }
    },

    stopReblend() {
        if (this._reblendAbort) this._reblendAbort.abort();
    },

    closeReblend() {
        if (this.reblendModal.phase === 'running') return;   // only Stop can exit a run
        const refresh = this.reblendModal.phase === 'done';
        this.reblendModal.open = false;
        if (refresh) location.reload();   // guarantees the page shows the new state
    },

    // Summary helpers for the 'done' panel.
    reblendMatched()   { return this.reblendModal.result?.replaced || 0; },
    reblendTotalExam() { const r = this.reblendModal.result || {}; return (r.replaced || 0) + (r.inserted || 0); },
    reblendCleared()   { const r = this.reblendModal.result || {}; return (r.restored || 0) + (r.deleted || 0); },

    async toggleBreakdown(b) {
        const id = b.id;
        this.expanded[id] = !this.expanded[id];
        if (this.expanded[id] && !this.breakdowns[id]) {
            this.bdLoading[id] = true;
            try {
                this.breakdowns[id] = await API.get('/costs/batch/' + id);
            } catch (e) {
                $store.app.showToast('Failed to load cost breakdown', 'error');
                this.expanded[id] = false;
            } finally {
                this.bdLoading[id] = false;
            }
        }
    },

    processLabel(callType) {
        const map = {
            qa_extraction:            'Q&A extraction',
            ms_extraction:            'Mark scheme extraction',
            ko_matching:              'Past-paper matching',
            handwritten_ocr:          'Handwritten OCR',
            handwritten_qa:           'Handwritten Q&A',
            multi_response_detection: 'Multi-response detection',
            mcq_generation:           'MCQ generation',
            answer_judging:           'Answer judging',
            fact_check:               'Fact check',
        };
        if (map[callType]) return map[callType];
        // Fallback: prettify an unknown call_type.
        return (callType || 'Unknown').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    },

    modelLabel(model) {
        if (!model || model === 'unknown') return 'unknown';
        return model.replace(/^claude-/, '');
    },

    fmt(usd) {
        return Alpine.store('app').fmtGBP(usd);
    },

    fmtTokens(n) {
        if (!n) return '0';
        if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
        return n.toString();
    },

    statusClass(s) {
        return {
            'completed': 'bg-green-100 text-green-700',
            'processing': 'bg-blue-100 text-blue-700',
            'pending':    'bg-gray-100 text-gray-600',
            'failed':     'bg-red-100 text-red-700',
        }[s] || 'bg-gray-100 text-gray-600';
    },

    optionChips(b) {
        const chips = [];
        if (b.is_handwritten) {
            chips.push('Handwritten');
        } else if (b.source_type === 'images') {
            chips.push('Images');
        } else {
            chips.push('PDF');
        }
        if (b.batch_type === 'knowledge_organiser') {
            chips.push('Knowledge Organiser');
        }
        if (b.category_name && b.subcategory_name) {
            chips.push(b.category_name + ' › ' + b.subcategory_name);
        } else if (b.category_name) {
            chips.push(b.category_name);
        } else if (b.subcategory_name) {
            chips.push(b.subcategory_name);
        }
        if (b.tier) {
            chips.push(b.tier);
        }
        return chips;
    }
}));
</script>

<div x-data="uploadHistoryPage">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Upload History</h1>
        <a href="#upload"
           class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
            + New Upload
        </a>
    </div>

    <!-- Summary bar -->
    <div x-show="!loading && batches.length > 0"
         class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6 flex flex-wrap gap-6 text-sm">
        <div>
            <span class="text-gray-500">Total uploads:</span>
            <span class="font-semibold text-gray-800 ml-1" x-text="batches.length"></span>
        </div>
        <div>
            <span class="text-gray-500">Total questions extracted:</span>
            <span class="font-semibold text-gray-800 ml-1"
                  x-text="batches.reduce((s, b) => s + (b.question_count || 0), 0)"></span>
        </div>
        <div>
            <span class="text-gray-500">Total AI cost:</span>
            <span class="font-semibold text-indigo-600 ml-1" x-text="fmt(totalCost)"></span>
        </div>
        <div class="ml-auto">
            <a href="#profile" @click="$store.app && null"
               class="text-xs text-indigo-600 hover:underline">View full cost breakdown →</a>
        </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="text-center py-12 text-gray-400">Loading...</div>

    <!-- Empty state -->
    <div x-show="!loading && batches.length === 0"
         class="text-center py-16 bg-white rounded-xl shadow-sm border border-gray-100">
        <div class="text-5xl mb-4">📂</div>
        <p class="text-gray-500 mb-4">No uploads yet.</p>
        <a href="#upload" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
            Upload your first PDF
        </a>
    </div>

    <!-- Batch list -->
    <div x-show="!loading" class="space-y-3">
        <template x-for="b in batches" :key="b.id">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <!-- Left: info -->
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                            <h3 class="font-semibold text-gray-800 truncate" x-text="b.filename"></h3>
                            <span class="text-xs px-2 py-0.5 rounded-full font-medium"
                                  :class="statusClass(b.status)"
                                  x-text="b.status"></span>
                            <!-- Past paper badge -->
                            <span x-show="b.batch_type === 'past_paper'"
                                  class="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-medium">
                                📄 Past Paper
                                <span x-show="b.exam_board"
                                      x-text="'· ' + b.exam_board + (b.exam_year ? ' ' + b.exam_year : '') + (b.paper_number ? ' ' + b.paper_number : '')"></span>
                            </span>
                            <span x-show="b.is_shared"
                                  class="text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700">Shared</span>
                        </div>
                        <p class="text-sm text-gray-500 mt-0.5">
                            <span x-text="b.subject_name" class="font-medium text-indigo-600"></span>
                            &middot; Pages <span x-text="b.page_start"></span>–<span x-text="b.page_end"></span>
                            &middot; <span x-text="b.question_count"></span> questions
                            (<span x-text="b.approved_count"></span> approved)
                            <template x-if="b.batch_type === 'knowledge_organiser'">
                                <span>
                                    <span x-show="b.past_paper_count > 0"
                                          class="ml-2 text-xs px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 whitespace-nowrap"
                                          x-text="'📄 ' + b.past_paper_count + '/' + b.question_count + ' from past papers'"></span>
                                    <span x-show="!b.past_paper_count"
                                          class="ml-2 text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500 whitespace-nowrap">All AI-generated</span>
                                </span>
                            </template>
                            &middot; <span x-text="new Date(b.created_at).toLocaleDateString()"></span>
                        </p>
                        <!-- Options chips -->
                        <div class="flex flex-wrap gap-1 mt-1">
                            <template x-for="chip in optionChips(b)" :key="chip">
                                <span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600"
                                      x-text="chip"></span>
                            </template>
                        </div>
                        <p x-show="b.error_message" class="text-xs text-red-500 mt-1" x-text="b.error_message"></p>
                    </div>

                    <!-- Right: cost + actions -->
                    <div class="flex items-center gap-4 sm:text-right">
                        <div>
                            <div class="text-lg font-bold"
                                 :class="b.cost_usd > 0 ? 'text-indigo-600' : 'text-gray-400'"
                                 x-text="fmt(b.cost_usd)"></div>
                            <div class="text-xs text-gray-400"
                                 x-text="b.api_calls ? b.api_calls + ' API call' + (b.api_calls !== 1 ? 's' : '') : 'No API calls'"></div>
                            <div x-show="b.input_tokens || b.output_tokens"
                                 class="text-xs text-gray-400"
                                 x-text="fmtTokens(b.input_tokens || 0) + ' in / ' + fmtTokens(b.output_tokens || 0) + ' out'"></div>
                            <button x-show="b.api_calls"
                                    @click="toggleBreakdown(b)"
                                    class="text-xs text-indigo-600 hover:underline mt-0.5 whitespace-nowrap">
                                <span x-text="expanded[b.id] ? 'Hide breakdown ▴' : 'Cost breakdown ▾'"></span>
                            </button>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <a :href="'#review/' + b.id"
                               class="text-xs text-indigo-600 hover:underline whitespace-nowrap">
                                View Q&amp;As
                            </a>
                            <a :href="'/pdfs/batch_' + b.id + '.pdf'" target="_blank"
                               class="text-xs text-gray-500 hover:underline whitespace-nowrap">
                                Source PDF
                            </a>
                            <button x-show="canReblend(b)"
                                    @click="openReblend(b)"
                                    class="text-xs text-emerald-700 hover:underline whitespace-nowrap text-left sm:text-right">
                                🔄 Regenerate blend
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Per-process cost breakdown (lazy-loaded) -->
                <div x-show="expanded[b.id]" class="mt-3 pt-3 border-t border-gray-100">
                    <div x-show="bdLoading[b.id]" class="text-xs text-gray-400">Loading breakdown…</div>
                    <template x-if="!bdLoading[b.id] && breakdowns[b.id]">
                        <div>
                            <div x-show="breakdowns[b.id].breakdown.length === 0"
                                 class="text-xs text-gray-400">No itemised API usage recorded for this upload.</div>
                            <div x-show="breakdowns[b.id].breakdown.length > 0" class="overflow-x-auto">
                                <table class="w-full text-xs">
                                    <thead>
                                        <tr class="text-gray-400 text-left border-b border-gray-100">
                                            <th class="py-1 pr-3 font-medium">Process</th>
                                            <th class="py-1 pr-3 font-medium">Model</th>
                                            <th class="py-1 pr-3 font-medium text-right">Calls</th>
                                            <th class="py-1 pr-3 font-medium text-right">Tokens (in / out)</th>
                                            <th class="py-1 font-medium text-right">Cost</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="row in breakdowns[b.id].breakdown"
                                                  :key="row.call_type + '|' + row.model">
                                            <tr class="border-b border-gray-50">
                                                <td class="py-1 pr-3 text-gray-700" x-text="processLabel(row.call_type)"></td>
                                                <td class="py-1 pr-3">
                                                    <span class="px-1.5 py-0.5 rounded bg-gray-100 text-gray-600 font-mono"
                                                          :class="row.model === 'unknown' ? 'italic text-gray-400' : ''"
                                                          x-text="modelLabel(row.model)"></span>
                                                </td>
                                                <td class="py-1 pr-3 text-right text-gray-500" x-text="row.call_count"></td>
                                                <td class="py-1 pr-3 text-right text-gray-500"
                                                    x-text="fmtTokens(row.input_tokens || 0) + ' / ' + fmtTokens(row.output_tokens || 0)"></td>
                                                <td class="py-1 text-right font-medium text-gray-700" x-text="fmt(row.cost_usd || 0)"></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                    <tfoot>
                                        <tr class="text-gray-700">
                                            <td class="py-1 pr-3 font-semibold" colspan="4">Total</td>
                                            <td class="py-1 text-right font-bold text-indigo-600"
                                                x-text="fmt(breakdowns[b.id].total_cost_usd || 0)"></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <p class="text-xs text-gray-400 mt-6 text-center">
        Pricing: $3.00 / 1M input tokens · $15.00 / 1M output tokens (Claude Sonnet).
        Costs shown in GBP (<span x-text="'$1 = £' + $store.app.gbpRate.toFixed(4)"></span><span x-show="$store.app.gbpRateDate">, rate date: <span x-text="$store.app.gbpRateDate"></span></span>).
    </p>

    <!-- ── Regenerate-blend modal (stays put; backdrop click does nothing) ──── -->
    <div x-show="reblendModal.open" style="display:none"
         class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <!-- Backdrop: deliberately has no @click handler so the dialog can't be dismissed by clicking out. -->
        <div class="absolute inset-0 bg-gray-900/50"></div>

        <div class="relative bg-white rounded-2xl shadow-xl border border-gray-100 w-full max-w-md p-6">

            <!-- CONFIRM -->
            <template x-if="reblendModal.phase === 'confirm'">
                <div>
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-xl">🔄</div>
                        <h3 class="text-lg font-bold text-gray-800">Regenerate blend</h3>
                    </div>
                    <p class="text-sm text-gray-600 mb-2">
                        Re-match every Knowledge Organiser point in
                        <span class="font-medium text-gray-800" x-text="reblendModal.batch?.filename"></span>
                        against <span class="font-medium">all past papers</span> currently in this subject.
                    </p>
                    <p class="text-sm text-gray-600 mb-3">This makes <span class="font-medium">one paid AI matching call</span>.</p>
                    <p x-show="reblendModal.hadBlend"
                       class="text-xs text-amber-800 bg-amber-50 border border-amber-100 rounded-lg p-2.5 mb-4">
                        Questions blended before this feature can’t be re-matched (their original wording wasn’t
                        saved) — they’ll be kept while the rest are re-matched. Re-upload the booklet for a 100% clean slate.
                    </p>
                    <div class="flex justify-end gap-2">
                        <button @click="closeReblend()"
                                class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition">Cancel</button>
                        <button @click="confirmReblend()"
                                class="px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 text-white hover:bg-emerald-700 transition">Regenerate</button>
                    </div>
                </div>
            </template>

            <!-- RUNNING -->
            <template x-if="reblendModal.phase === 'running'">
                <div class="text-center py-2">
                    <svg class="animate-spin w-10 h-10 text-emerald-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    <h3 class="text-lg font-bold text-gray-800 mb-1">Regenerating blend…</h3>
                    <p class="text-sm text-gray-500 mb-5">
                        Matching <span class="font-medium" x-text="reblendModal.batch?.filename"></span>
                        against your past papers. This can take a few moments — please keep this open.
                    </p>
                    <button @click="stopReblend()"
                            class="px-4 py-2 rounded-lg text-sm font-medium bg-red-50 text-red-600 hover:bg-red-100 transition">✕ Stop</button>
                </div>
            </template>

            <!-- DONE -->
            <template x-if="reblendModal.phase === 'done'">
                <div>
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-xl">✅</div>
                        <h3 class="text-lg font-bold text-gray-800">Blend regenerated</h3>
                    </div>
                    <div class="space-y-2 text-sm mb-2">
                        <div class="flex justify-between gap-3">
                            <span class="text-gray-500">Knowledge points matched to exam questions</span>
                            <span class="font-semibold text-gray-800" x-text="reblendMatched()"></span>
                        </div>
                        <div class="flex justify-between gap-3">
                            <span class="text-gray-500">Exam questions added in total</span>
                            <span class="font-semibold text-gray-800" x-text="reblendTotalExam()"></span>
                        </div>
                        <div class="flex justify-between gap-3" x-show="reblendCleared() > 0">
                            <span class="text-gray-500">Previous blend items cleared &amp; re-matched</span>
                            <span class="font-semibold text-gray-800" x-text="reblendCleared()"></span>
                        </div>
                        <div class="flex justify-between gap-3 border-t border-gray-100 pt-2 mt-2">
                            <span class="text-gray-500">AI cost for this regeneration</span>
                            <span class="font-bold text-indigo-600" x-text="fmt(reblendModal.result?.cost_usd || 0)"></span>
                        </div>
                    </div>
                    <p x-show="reblendMatched() === 0" class="text-xs text-gray-400 mb-2">No new exam matches were found this time.</p>
                    <div class="flex justify-end mt-4">
                        <button @click="closeReblend()"
                                class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 transition">Done &amp; refresh</button>
                    </div>
                </div>
            </template>

            <!-- ERROR -->
            <template x-if="reblendModal.phase === 'error'">
                <div>
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-xl">⚠️</div>
                        <h3 class="text-lg font-bold text-gray-800">Regenerate failed</h3>
                    </div>
                    <p class="text-sm text-red-600 mb-4" x-text="reblendModal.error"></p>
                    <div class="flex justify-end">
                        <button @click="closeReblend()"
                                class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 transition">Close</button>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
