<style>[x-cloak]{display:none}</style>
<script>
Alpine.data('pastPapersPage', () => ({
    subjects: [],
    subjectId: null,
    papers: [],
    loading: false,
    expanded: {},
    questions: {},
    categories: [],
    subcategories: {},
    selected: {},
    bulkCategoryId: '',
    bulkSubcategoryId: '',
    editing: null,
    editForm: {},
    _redetectingId: null,   // id of the paper currently being re-detected (null = none)
    selectedPapers: [],
    importing: false,
    importResult: null,
    importError: '',

    async init() {
        this.loading = true;
        this.subjects = await API.get('/subjects');
        if (!this.subjects.length) { this.loading = false; return; }
        // Default to the first subject that has past papers; fall back to subjects[0]
        for (const s of this.subjects) {
            const papers = await API.get(`/past-papers?subject_id=${s.id}`);
            if (papers.length) { this.subjectId = s.id; this.papers = papers; break; }
        }
        if (!this.subjectId) this.subjectId = this.subjects[0].id;
        this.categories = await API.get(`/categories?subject_id=${this.subjectId}`);
        this.loading = false;
    },

    async loadSubject() {
        this.loading = true;
        this.expanded = {}; this.questions = {}; this.selected = {}; this.selectedPapers = [];
        this.papers = await API.get(`/past-papers?subject_id=${this.subjectId}`);
        this.categories = await API.get(`/categories?subject_id=${this.subjectId}`);
        this.loading = false;
    },

    paperLabel(p) {
        return [p.exam_board, p.exam_year, p.paper_number, p.tier].filter(Boolean).join(' ') || p.filename;
    },

    async toggle(batchId) {
        this.expanded[batchId] = !this.expanded[batchId];
        if (this.expanded[batchId] && !this.questions[batchId]) {
            const res = await API.get(`/questions?batch_id=${batchId}&question_source=past_paper&limit=200`);
            this.questions[batchId] = res.questions;
        }
    },

    async deletePaper(p) {
        if (!confirm(`Delete "${this.paperLabel(p)}" and all its questions? This cannot be undone.`)) return;
        await API.del(`/past-papers/${p.id}`);
        await this.loadSubject();
    },

    async deleteQuestion(batchId, q) {
        if (!confirm('Delete this question?')) return;
        await API.del(`/questions/${q.id}`);
        this.questions[batchId] = this.questions[batchId].filter(x => x.id !== q.id);
    },

    startEdit(q) {
        this.editing = q.id;
        this.editForm = {
            question_text: q.question_text, answer_text: q.answer_text,
            question_type: q.question_type, difficulty: q.difficulty,
            question_ref: q.question_ref || '',
        };
    },
    async saveEdit(batchId, q) {
        await API.put(`/questions/${q.id}`, this.editForm);
        Object.assign(q, this.editForm);
        this.editing = null;
    },

    async loadSubcats(categoryId) {
        if (categoryId && !this.subcategories[categoryId]) {
            this.subcategories[categoryId] = await API.get(`/subcategories?category_id=${categoryId}`);
        }
    },

    async tagOne(q, categoryId, subcategoryId) {
        const catId = Number(categoryId) || null;
        const subId = Number(subcategoryId) || null;
        await API.post('/past-papers/tag', {
            question_ids: [q.id],
            category_id: catId,
            subcategory_id: subId,
        });
        q.category_id = catId;
        q.subcategory_id = subId;
    },

    selectedIds(batchId) {
        return (this.questions[batchId] || []).filter(q => this.selected[q.id]).map(q => q.id);
    },
    toggleAll(batchId) {
        const qs = this.questions[batchId] || [];
        const allSel = qs.every(q => this.selected[q.id]);
        qs.forEach(q => this.selected[q.id] = !allSel);
    },
    async applyBulkTag(batchId) {
        const ids = this.selectedIds(batchId);
        if (!ids.length) return;
        const catId = Number(this.bulkCategoryId) || null;
        const subId = Number(this.bulkSubcategoryId) || null;
        await API.post('/past-papers/tag', {
            question_ids: ids,
            category_id: catId,
            subcategory_id: subId,
        });
        const qs = this.questions[batchId];
        qs.forEach(q => { if (this.selected[q.id]) {
            q.category_id = catId;
            q.subcategory_id = subId;
        }});
        ids.forEach(id => this.selected[id] = false);
    },

    // Re-crop modal
    recrop: { open: false, q: null, batchId: null, pageImg: '', rect: null, dragging: false, resizing: false, start: null },

    openRecrop(batchId, q) {
        this.recrop = {
            open: true, q, batchId,
            pageImg: `/images/batch_${q.batch_id}/page_${q.page_number}_full.png`,
            rect: { x: 20, y: 20, w: 40, h: 30 },
            dragging: false, resizing: false, start: null,
        };
    },
    _pct(e, el) {
        const r = el.getBoundingClientRect();
        return { x: ((e.clientX - r.left) / r.width) * 100, y: ((e.clientY - r.top) / r.height) * 100 };
    },
    startMove(e, el) { this.recrop.dragging = true; this.recrop.start = this._pct(e, el); },
    startResize(e, el) { e.stopPropagation(); this.recrop.resizing = true; this.recrop.start = this._pct(e, el); },
    onMove(e, el) {
        if (!this.recrop.dragging && !this.recrop.resizing) return;
        const p = this._pct(e, el), s = this.recrop.start, R = this.recrop.rect;
        const dx = p.x - s.x, dy = p.y - s.y;
        if (this.recrop.dragging) {
            R.x = Math.max(0, Math.min(100 - R.w, R.x + dx));
            R.y = Math.max(0, Math.min(100 - R.h, R.y + dy));
        } else {
            R.w = Math.max(5, Math.min(100 - R.x, R.w + dx));
            R.h = Math.max(5, Math.min(100 - R.y, R.h + dy));
        }
        this.recrop.start = p;
    },
    endMove() { this.recrop.dragging = false; this.recrop.resizing = false; },
    async saveRecrop() {
        const R = this.recrop.rect, q = this.recrop.q;
        const res = await API.post(`/past-papers/questions/${q.id}/recrop`, {
            bbox_x_pct: R.x, bbox_y_pct: R.y, bbox_w_pct: R.w, bbox_h_pct: R.h,
        });
        q.image_filename = res.filename;
        q.image_id = res.image_id;
        this.recrop.open = false;
    },
    async detachImage(q) {
        await API.put(`/past-papers/questions/${q.id}/image`, { image_id: null });
        q.image_filename = null; q.image_id = null;
    },

    toggleSelectPaper(id) {
        const i = this.selectedPapers.indexOf(id);
        if (i === -1) this.selectedPapers.push(id); else this.selectedPapers.splice(i, 1);
    },
    allPapersSelected() {
        return this.papers.length > 0 && this.selectedPapers.length === this.papers.length;
    },
    toggleSelectAllPapers() {
        this.selectedPapers = this.allPapersSelected() ? [] : this.papers.map(p => p.id);
    },
    exportSelected() {
        if (!this.selectedPapers.length) return;
        const url = '/api/past-papers/export?ids=' + this.selectedPapers.join(',');
        const token = API.getToken();
        fetch(url, { headers: { Authorization: 'Bearer ' + token } })
            .then(r => { if (!r.ok) throw new Error('Export failed'); return r.blob().then(b => ({ b, r })); })
            .then(({ b, r }) => {
                const cd = r.headers.get('content-disposition') || '';
                const m = cd.match(/filename="?([^"]+)"?/);
                const name = m ? m[1] : 'past-papers.zip';
                const a = document.createElement('a');
                a.href = URL.createObjectURL(b);
                a.download = name;
                a.click();
                URL.revokeObjectURL(a.href);
            })
            .catch(e => { this.importError = e.message; });
    },
    async importFile(ev) {
        const f = ev.target.files[0];
        if (!f) return;
        this.importing = true; this.importResult = null; this.importError = '';
        try {
            const fd = new FormData();
            fd.append('file', f);
            const body = await API.upload('/past-papers/import', fd);
            this.importResult = body;
            await this.loadSubject();
        } catch (e) {
            this.importError = e.message;
        } finally {
            this.importing = false;
            ev.target.value = '';
        }
    },

    async redetectMultiResponse(paper) {
        if (this._redetectingId !== null) return;   // one at a time
        this._redetectingId = paper.id;
        try {
            const res = await API.post(`/past-papers/${paper.id}/detect-multi-response`, {});
            const msg = res.updated > 0
                ? `Structured ${res.updated} tick-box question${res.updated === 1 ? '' : 's'} (scanned ${res.scanned}).`
                : `No tick-box questions found (scanned ${res.scanned}).`;
            Alpine.store('app').showToast(msg, 'success');
            // Refresh the currently shown paper's questions
            if (this.subjectId) {
                this.papers = await API.get(`/past-papers?subject_id=${this.subjectId}`);
            }
        } catch (e) {
            Alpine.store('app').showToast(e.message || 'Re-detect failed', 'error');
        } finally {
            this._redetectingId = null;
        }
    },
}));
</script>

<div x-data="pastPapersPage" class="max-w-5xl mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Past Paper Library</h1>

    <div class="mb-4 flex items-center gap-2">
        <label class="text-sm font-medium">Subject:</label>
        <select x-model="subjectId" @change="loadSubject()" class="border rounded px-2 py-1">
            <template x-for="s in subjects" :key="s.id">
                <option :value="s.id" x-text="s.name"></option>
            </template>
        </select>
    </div>

    <div x-show="loading" class="text-gray-500">Loading…</div>
    <div x-show="!loading && papers.length === 0" class="text-gray-500">
        No past papers for this subject yet. Upload one from the Upload page.
    </div>

    <div x-show="!loading" class="flex items-center gap-2 mb-3">
        <button @click="exportSelected()" :disabled="selectedPapers.length === 0"
                class="px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-600 text-white disabled:opacity-40 disabled:cursor-not-allowed">
            Export selected (<span x-text="selectedPapers.length"></span>)
        </button>
        <button @click="toggleSelectAllPapers()"
                class="px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 hover:bg-gray-200">
            <span x-text="allPapersSelected() ? 'Deselect all' : 'Select all'"></span>
        </button>
        <label class="px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-100 text-gray-700 cursor-pointer hover:bg-gray-200">
            Import&#x2026;
            <input type="file" accept=".zip" class="hidden" @change="importFile($event)">
        </label>
        <span x-show="importing" class="text-sm text-gray-500">Importing&#x2026;</span>
    </div>

    <template x-for="p in papers" :key="p.id">
        <div class="border rounded-lg mb-3 bg-white shadow-sm">
            <div class="flex items-center justify-between p-3">
                <input type="checkbox" :checked="selectedPapers.includes(p.id)" @change="toggleSelectPaper(p.id)"
                       class="w-4 h-4 rounded border-gray-300 mr-2 shrink-0">
                <button @click="toggle(p.id)" class="flex items-start gap-2 text-left min-w-0 flex-1">
                    <span class="mt-0.5" x-text="expanded[p.id] ? '▼' : '▶'"></span>
                    <span class="min-w-0">
                        <span class="font-semibold" x-text="paperLabel(p)"></span>
                        <span class="text-sm text-gray-500 ml-2"
                              x-text="`${p.question_count} questions · ${p.figure_count} figures`"></span>
                        <span x-show="p.filename" class="block text-xs text-gray-400 font-mono truncate"
                              :title="p.filename" x-text="p.filename"></span>
                    </span>
                </button>
                <div class="flex items-center gap-2">
                    <button @click="redetectMultiResponse(p)" :disabled="_redetectingId !== null"
                            class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 transition disabled:opacity-50 inline-flex items-center gap-1.5"
                            title="Re-scan this paper for tick-box (multiple-response) questions">
                        <template x-if="_redetectingId === p.id">
                            <svg class="animate-spin h-3.5 w-3.5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                        </template>
                        <span x-text="_redetectingId === p.id ? `Scanning ${p.question_count} questions…` : 'Re-detect tick-box Qs'"></span>
                    </button>
                    <button @click="deletePaper(p)"
                            class="text-red-600 text-sm hover:underline">Delete paper</button>
                </div>
            </div>

            <div x-show="expanded[p.id]" class="border-t p-3 space-y-3">
                <div class="flex flex-wrap items-center gap-2 bg-gray-50 p-2 rounded"
                     x-show="selectedIds(p.id).length">
                    <span class="text-sm" x-text="`${selectedIds(p.id).length} selected`"></span>
                    <select x-model="bulkCategoryId" @change="loadSubcats(bulkCategoryId)"
                            class="border rounded px-2 py-1 text-sm">
                        <option value="">— category —</option>
                        <template x-for="c in categories" :key="c.id">
                            <option :value="c.id" x-text="c.name"></option>
                        </template>
                    </select>
                    <select x-model="bulkSubcategoryId" class="border rounded px-2 py-1 text-sm"
                            x-show="bulkCategoryId">
                        <option value="">— subcategory —</option>
                        <template x-for="sc in (subcategories[bulkCategoryId] || [])" :key="sc.id">
                            <option :value="sc.id" x-text="sc.name"></option>
                        </template>
                    </select>
                    <button @click="applyBulkTag(p.id)"
                            class="bg-indigo-600 text-white px-3 py-1 rounded text-sm">Apply tag</button>
                </div>

                <button @click="toggleAll(p.id)" class="text-sm text-indigo-600">Select all</button>

                <template x-for="q in (questions[p.id] || [])" :key="q.id">
                    <div class="border rounded p-2">
                        <div class="flex items-start gap-2">
                            <input type="checkbox" x-model="selected[q.id]" class="mt-1">
                            <div class="flex-1">
                                <div class="text-xs text-gray-500" x-text="q.question_ref || ''"></div>

                                <div x-show="editing !== q.id">
                                    <div class="whitespace-pre-wrap" x-text="q.question_text"></div>
                                    <details class="mt-1">
                                        <summary class="text-sm text-indigo-600 cursor-pointer">Answer</summary>
                                        <div class="whitespace-pre-wrap text-sm text-gray-700"
                                             x-text="q.answer_text || '(no answer)'"></div>
                                    </details>
                                    <template x-if="q.image_filename">
                                    <div class="relative inline-block mt-2">
                                        <img :src="`/images/${q.image_filename}`" class="max-h-40 rounded border" alt="figure">
                                        <button @click="detachImage(q)"
                                                class="absolute top-1 right-1 bg-white/90 text-red-600 rounded-full w-6 h-6 text-xs"
                                                title="Detach figure">✕</button>
                                    </div>
                                    </template>
                                    <button @click="openRecrop(p.id, q)" class="text-xs text-indigo-600 block mt-1"
                                            x-text="q.image_filename ? 'Re-crop figure' : 'Set figure'"></button>
                                    <div class="mt-2 flex flex-wrap items-center gap-2">
                                        <select class="border rounded px-1 py-0.5 text-xs"
                                                @change="loadSubcats($event.target.value); tagOne(q, $event.target.value, '')">
                                            <option value="">— category —</option>
                                            <template x-for="c in categories" :key="c.id">
                                                <option :value="c.id" :selected="q.category_id === c.id"
                                                        x-text="c.name"></option>
                                            </template>
                                        </select>
                                        <button @click="startEdit(q)" class="text-xs text-indigo-600">Edit</button>
                                        <button @click="deleteQuestion(p.id, q)" class="text-xs text-red-600">Delete</button>
                                    </div>
                                </div>

                                <div x-show="editing === q.id" class="space-y-1">
                                    <input x-model="editForm.question_ref" placeholder="ref (e.g. 1a)"
                                           class="border rounded px-2 py-1 text-sm w-32">
                                    <textarea x-model="editForm.question_text" rows="2"
                                              class="border rounded px-2 py-1 text-sm w-full"></textarea>
                                    <textarea x-model="editForm.answer_text" rows="2"
                                              class="border rounded px-2 py-1 text-sm w-full"></textarea>
                                    <div class="flex gap-2">
                                        <button @click="saveEdit(p.id, q)"
                                                class="bg-green-600 text-white px-3 py-1 rounded text-sm">Save</button>
                                        <button @click="editing = null"
                                                class="px-3 py-1 rounded text-sm border">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <!-- Import result modal -->
    <div x-show="importResult || importError" style="display:none"
         class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-gray-900/50" @click="importResult = null; importError = ''"></div>
        <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
            <h3 class="text-lg font-semibold mb-3">Import results</h3>
            <template x-if="importError">
                <p class="text-red-600 text-sm" x-text="importError"></p>
            </template>
            <template x-if="importResult">
                <div class="space-y-2 text-sm">
                    <p class="text-green-700">
                        Imported <span x-text="importResult.imported.length"></span> paper(s).
                    </p>
                    <template x-if="importResult.skipped.length">
                        <div>
                            <p class="text-amber-700 font-medium">Skipped:</p>
                            <ul class="list-disc list-inside text-gray-600">
                                <template x-for="s in importResult.skipped" :key="s.filename">
                                    <li><span x-text="s.filename"></span> &#x2014; <span x-text="s.reason"></span></li>
                                </template>
                            </ul>
                        </div>
                    </template>
                    <template x-if="importResult.errors && importResult.errors.length">
                        <div>
                            <p class="text-red-700 font-medium">Errors:</p>
                            <ul class="list-disc list-inside text-gray-600">
                                <template x-for="e in importResult.errors" :key="e.slug">
                                    <li><span x-text="e.slug"></span> &#x2014; <span x-text="e.error"></span></li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </div>
            </template>
            <div class="mt-4 text-right">
                <button @click="importResult = null; importError = ''"
                        class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium">Close</button>
            </div>
        </div>
    </div>

    <!-- Re-crop modal -->
    <template x-if="recrop.open">
    <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg p-4 max-w-3xl w-full">
            <h3 class="font-semibold mb-2">Re-crop figure — drag the box, drag the corner to resize</h3>
            <div class="relative inline-block select-none"
                 @pointermove="onMove($event, $refs.pageImgEl)" @pointerup="endMove()" @pointerleave="endMove()">
                <img x-ref="pageImgEl" :src="recrop.pageImg" class="max-h-[70vh] block" alt="page"
                     @error="recrop.open = false; alert('Original page image unavailable.')">
                <div x-show="recrop.rect" class="absolute border-2 border-indigo-500 bg-indigo-500/20 cursor-move"
                     :style="`left:${recrop.rect.x}%;top:${recrop.rect.y}%;width:${recrop.rect.w}%;height:${recrop.rect.h}%`"
                     @pointerdown="startMove($event, $refs.pageImgEl)">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-indigo-600 cursor-se-resize"
                         @pointerdown="startResize($event, $refs.pageImgEl)"></div>
                </div>
            </div>
            <div class="mt-3 flex gap-2 justify-end">
                <button @click="recrop.open = false" class="px-3 py-1 rounded border">Cancel</button>
                <button @click="saveRecrop()" class="px-3 py-1 rounded bg-indigo-600 text-white">Save crop</button>
            </div>
        </div>
    </div>
    </template>
</div>
